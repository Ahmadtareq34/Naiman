<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="login-container">
      <!-- Left Half (Logo) -->
      <div class="login-left">
        <a href="../home/index.html">
          <img
            src="/images/Naiman Logo No Background.png"
            alt="Logo"
            class="logo"
          />
        </a>
      </div>

      <!-- Right Half (Login Form) -->
      <div class="login-right">
        <div class="login-box">
          <h1>Welcome Back Again</h1>
          <p>Please Enter Your Login Details</p>

          <!-- Login Form -->
          <div class="error-tab hidden" id="error-tab"></div>
          <form
            action="/login"
            method="POST"
            id="login-form"
          >
            <!-- Email Field -->
            <div class="input-container">
              <label for="email">Email</label>
              <input
                type="email"
                name="email"
                id="email"
                placeholder="Enter your email"
                required
              />
              <hr />
            </div>

            <!-- Password Field -->
            <div class="input-container password-field">
              <label for="password">Password</label>
              <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter your password"
                required
              />
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="20"
                height="20"
                class="eye-icon"
                id="togglePassword"
              >
                <path
                  d="M12 4.5C7.305 4.5 3.354 7.182 1.5 11.25c1.854 4.068 5.805 6.75 10.5 6.75s8.646-2.682 10.5-6.75C20.646 7.182 16.695 4.5 12 4.5zm0 10.5a3.75 3.75 0 1 1 0-7.5 3.75 3.75 0 0 1 0 7.5z"
                />
              </svg>
              <hr />
            </div>

            <!-- Login Button -->
            <button type="submit" class="login-btn">Log In</button>
          </form>

          <!-- Remember Me Checkbox and Admin Link -->
          <div class="remember-container">
            <input type="checkbox" id="remember-me" />
            <label for="remember-me">Remember Me</label>
            <a href="#" class="forgot-password">Forgot Password?</a>
          </div>
          <div class="admin-link">
            <span>Are you an</span>
            <a href="../admin/adminlogin.html">Admin?</a>
          </div>
          <div class="signup-link" style="margin-top: 15px; text-align: center">
            <span>Not a user?</span>
            <a
              href="../signup/signup.html"
              style="
                color: maroon;
                text-decoration: underline;
                font-weight: bold;
              "
              >Create Account</a
            >
          </div>
        </div>
      </div>
    </div>

    <!-- JavaScript for Password Toggle -->
    <script>
      const togglePassword = document.querySelector("#togglePassword");
      const password = document.querySelector("#password");

      togglePassword.addEventListener("click", function () {
        const type =
          password.getAttribute("type") === "password" ? "text" : "password";
        password.setAttribute("type", type);
        this.classList.toggle("active");
      });
    </script>

    <script src="login.js"></script>
  </body>
</html>
