<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recommended Saloons</title>
    <link rel="stylesheet" href="../nav/nav.css" />
    <link rel="stylesheet" href="recommended.css" />
    <link rel="stylesheet" href="../footer/footer.css" />
  </head>
  <body>
    <div id="navbar"></div>

    <section class="recommended-page">
      <h1>Recommended for You 🌟</h1>
      <div class="grid-container" id="recommended-container"></div>
    </section>

    <div id="footer-container"></div>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        // Load navbar
        const nav = await fetch("../nav/nav.html").then((res) => res.text());
        document.getElementById("navbar").innerHTML = nav;

        // Load footer
        const footer = await fetch("../footer/footer.html").then((res) =>
          res.text()
        );
        document.getElementById("footer-container").innerHTML = footer;
        const footerStyle = document.createElement("link");
        footerStyle.rel = "stylesheet";
        footerStyle.href = "../footer/footer.css";
        document.head.appendChild(footerStyle);

        const categoryTitleMap = {
          barbershop: "Barber Shops",
          nailsalon: "Nail Salons",
          spa: "Spas",
          massage: "Massage Centers",
          skincare: "Skincare Clinics",
          hairsalon: "Hair Salons",
          makeup: "Makeup Centers",
          therapy: "Therapy Centers",
          hairremoval: "Hair Removal Centers",
        };

        let favorites = [];
        let loggedIn = false;

        try {
          const userRes = await fetch(
            "/auth/user-status",
            {
              credentials: "include",
            }
          );
          const user = await userRes.json();
          loggedIn = user.loggedIn;

          if (loggedIn) {
            const favRes = await fetch("/favorites/ids", {
              credentials: "include",
            });
            favorites = await favRes.json();
          }
        } catch (err) {
          console.warn("User not logged in or error fetching favorites.");
        }

        const res = await fetch("/recommended");
        const recommended = await res.json();

        const container = document.getElementById("recommended-container");

        for (const category in recommended) {
          const section = document.createElement("div");
          section.classList.add("category-block");

          const title = document.createElement("h2");
          title.textContent = categoryTitleMap[category] || category;
          section.appendChild(title);

          const cardGroup = document.createElement("div");
          cardGroup.classList.add("card-group");

          if (recommended[category].length === 0) {
            const noData = document.createElement("p");
            noData.textContent = "No reviewed saloons yet in this category.";
            noData.style.color = "gray";
            noData.style.padding = "10px 0 20px";
            cardGroup.appendChild(noData);
          } else {
            recommended[category].forEach((salon) => {
              const isFav = favorites.includes(salon.id);
              const heart = isFav ? "❤️" : "🤍";
              const active = isFav ? "active" : "";

              const card = document.createElement("div");
              card.classList.add("shop-card");

              card.innerHTML = `
                <a href="../saloons/saloon.html?id=${salon.id}">
                  <img src="${salon.image_path}" alt="${
                salon.name
              }" />
                  <div class="shop-info">
                    <h3>${salon.name}</h3>
                    <p><b>📍</b> ${salon.location}</p>
                    <p><b>📞</b> ${salon.contact}</p>
                    <p><b>⭐</b> ${parseFloat(salon.avg_rating).toFixed(
                      1
                    )} / 5</p>
                  </div>
                </a>
                ${
                  loggedIn
                    ? `<button class="favorite-btn ${active}" data-id="${salon.id}" onclick="toggleFavorite(event, this)">${heart}</button>`
                    : ""
                }
              `;

              cardGroup.appendChild(card);
            });
          }

          section.appendChild(cardGroup);
          container.appendChild(section);
        }
      });

      async function toggleFavorite(event, button) {
        event.preventDefault();
        event.stopPropagation();

        const shopId = button.getAttribute("data-id");

        const isActive = button.classList.contains("active");

        if (isActive) {
          button.textContent = "🤍";
          button.classList.remove("active");

          await fetch(`/favorites/${shopId}`, {
            method: "DELETE",
            credentials: "include",
          });
        } else {
          button.textContent = "❤️";
          button.classList.add("active");

          await fetch("/favorites", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ saloon_id: shopId }),
          });
        }
      }
    </script>

    <script src="../nav/nav.js"></script>
    <script src="../footer/footer.js"></script>
  </body>
</html>
