<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <script>
      const BASE_URL =
        window.location.hostname === "localhost"
          ? "http://localhost:3000"
          : "https://naiman.onrender.com";
    </script>
    <link rel="stylesheet" href="adminlogin.css" />
  </head>
  <body>
    <div class="login-container">
      <!-- Left Half (Logo) -->
      <div class="login-left">
        <a href="../home/index.html">
          <img
            src="/images/Naiman Logo No Background.png"
            alt="Logo"
            class="logo"
          />
        </a>
      </div>

      <!-- Right Half (Admin Login Form) -->
      <div class="login-right">
        <div class="login-box">
          <h1>Admin Portal</h1>
          <p>Please Enter Your Admin Credentials</p>

          <!-- Email Field -->
          <div class="input-container">
            <label for="email">Admin Email</label>
            <input
              type="email"
              id="email"
              placeholder="Enter your admin email"
              required
            />
            <hr />
          </div>

          <!-- Password Field -->
          <div class="input-container password-field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              class="eye-icon"
              id="togglePassword"
            >
              <path
                d="M12 4.5C7.305 4.5 3.354 7.182 1.5 11.25c1.854 4.068 5.805 6.75 10.5 6.75s8.646-2.682 10.5-6.75C20.646 7.182 16.695 4.5 12 4.5zm0 10.5a3.75 3.75 0 1 1 0-7.5 3.75 3.75 0 0 1 0 7.5z"
              />
            </svg>
            <hr />
          </div>

          <!-- Login Button -->
          <button class="login-btn" id="admin-login-btn">Log In</button>

          <!-- Remember Me Checkbox -->
          <div class="remember-container">
            <input type="checkbox" id="remember-me" />
            <label for="remember-me">Remember Me</label>
          </div>

          <!-- Status/Error Message -->
          <p id="admin-status" style="color: red; margin-top: 10px"></p>
        </div>
      </div>
    </div>

    <!-- JavaScript -->
    <script>
      // Toggle password visibility
      const togglePassword = document.querySelector("#togglePassword");
      const password = document.querySelector("#password");

      togglePassword.addEventListener("click", function () {
        const type =
          password.getAttribute("type") === "password" ? "text" : "password";
        password.setAttribute("type", type);
        this.classList.toggle("active");
      });

      // Handle login
      document
        .getElementById("admin-login-btn")
        .addEventListener("click", async () => {
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value.trim();
          const statusMessage = document.getElementById("admin-status");

          if (!email || !password) {
            statusMessage.textContent = "Please fill in all fields.";
            return;
          }

          try {
            const res = await fetch(`${BASE_URL}/admin/login`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              credentials: "include",
              body: JSON.stringify({ email, password }),
            });

            const data = await res.json();

            if (data.success) {
              window.location.href = "admin.html";
            } else {
              statusMessage.textContent = data.message || "Login failed.";
            }
          } catch (err) {
            console.error("Login error:", err);
            statusMessage.textContent = "Something went wrong.";
          }
        });
    </script>
  </body>
</html>
